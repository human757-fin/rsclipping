[package]
name = "rsclipping"
version = "0.1.0"
edition = "2021"
description = "Screen clipper/recorder in Rust — minimal RAM, max throughput"
license = "MIT"

[[bin]]
name = "rsclipping"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
dirs = "5"
log = "0.4"
env_logger = "0.11"
eframe = "0.32"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(not(windows))'.dependencies]
x11rb = { version = "0.13", features = ["shm", "randr"] }
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1